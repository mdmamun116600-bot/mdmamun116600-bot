<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none">
  <defs>
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.8" stroke-opacity="0.55" />
      <circle cx="0" cy="0" r="1" fill="#00F0FF" fill-opacity="0.25" />
    </pattern>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="hud-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-main {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 900;
      font-size: 76px;
      letter-spacing: 14px;
      fill: #F8FAFC;
    }
    .title-glitch-1 {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 900;
      font-size: 76px;
      letter-spacing: 14px;
      fill: #00F0FF;
      opacity: 0.7;
      animation: glitch1 3.2s infinite steps(1);
    }
    .title-glitch-2 {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 900;
      font-size: 76px;
      letter-spacing: 14px;
      fill: #38BDF8;
      opacity: 0.5;
      animation: glitch2 3.2s infinite steps(1);
    }
    .subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 3.5px;
      fill: #94A3B8;
    }
    .status-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2.5px;
      fill: #00F0FF;
    }
    .hud-tag {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #475569;
    }
    .blink-dot {
      animation: blink 1.2s infinite ease-in-out;
    }
    .scanline {
      animation: scan 5s linear infinite;
    }

    @keyframes glitch1 {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
      90% { transform: translate(-4px, -2px); opacity: 0.75; }
      92% { transform: translate(3px, 1px); opacity: 0.5; }
      94% { transform: translate(-2px, 2px); opacity: 0.8; }
      96% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes glitch2 {
      0%, 89%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(4px, 2px); opacity: 0.65; }
      93% { transform: translate(-3px, -1px); opacity: 0.55; }
      95% { transform: translate(2px, -2px); opacity: 0.7; }
      97% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes scan {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(320px); }
    }
  </style>

  <!-- Pitch Black Background & Cyber Grid -->
  <rect width="1200" height="300" fill="#050505" rx="6" />
  <rect width="1200" height="300" fill="url(#cyber-grid)" rx="6" />

  <!-- Moving Scanline -->
  <rect class="scanline" x="0" y="0" width="1200" height="50" fill="url(#scan-grad)" />

  <!-- Outer Tactical Frame -->
  <rect x="14" y="14" width="1172" height="272" stroke="#1F2937" stroke-width="1" rx="4" />

  <!-- HUD Corner Brackets (#00F0FF) -->
  <!-- Top-Left -->
  <path d="M 14 48 L 14 14 L 58 14" stroke="#00F0FF" stroke-width="2.5" filter="url(#cyan-glow)" />
  <!-- Top-Right -->
  <path d="M 1142 14 L 1186 14 L 1186 48" stroke="#00F0FF" stroke-width="2.5" filter="url(#cyan-glow)" />
  <!-- Bottom-Left -->
  <path d="M 14 252 L 14 286 L 58 286" stroke="#00F0FF" stroke-width="2.5" filter="url(#cyan-glow)" />
  <!-- Bottom-Right -->
  <path d="M 1142 286 L 1186 286 L 1186 252" stroke="#00F0FF" stroke-width="2.5" filter="url(#cyan-glow)" />

  <!-- Corner Telemetry Tags -->
  <text x="34" y="38" class="hud-tag">SYS.ID // 0x4D414D554E</text>
  <text x="1166" y="38" text-anchor="end" class="hud-tag">NODE // SECURE</text>
  <text x="34" y="270" class="hud-tag">PROTOCOL // PAWN • PY • WEB</text>
  <text x="1166" y="270" text-anchor="end" class="hud-tag">BUILD // v2.0.26</text>

  <!-- Glitch Title -->
  <text x="600" y="142" text-anchor="middle" class="title-glitch-1">MAMUN</text>
  <text x="600" y="142" text-anchor="middle" class="title-glitch-2">MAMUN</text>
  <text x="600" y="142" text-anchor="middle" class="title-main" filter="url(#cyan-glow)">MAMUN</text>

  <!-- Divider Line -->
  <rect x="260" y="162" width="680" height="1.5" fill="url(#hud-line)" />

  <!-- Sub-headline -->
  <text x="600" y="194" text-anchor="middle" class="subtitle">SYSTEM ARCHITECT // SA-MP (PAWN) • PYTHON • WEB</text>

  <!-- Animated Blinking Status Indicator -->
  <g transform="translate(600, 232)">
    <rect x="-195" y="-16" width="390" height="26" rx="3" fill="#0D1117" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.55" />
    <circle class="blink-dot" cx="-172" cy="-3" r="4.5" fill="#00F0FF" filter="url(#cyan-glow)" />
    <text x="8" y="2" text-anchor="middle" class="status-text">[ SYSTEM ONLINE // READY TO DEPLOY ]</text>
  </g>
</svg>
